services:

  # ── FastAPI RAG application ──────────────────────────────────────────────────
  api:
    build: .
    image: senior-rag-api:latest
    container_name: senior_rag_api
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - hf_cache:/hf_cache
      - ./logs:/app/logs
    depends_on:
      chroma:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rag_net
    restart: unless-stopped

  # ── ChromaDB vector store ────────────────────────────────────────────────────
  chroma:
    image: chromadb/chroma:1.0.5
    container_name: senior_rag_chroma
    ports:
      - "8001:8000"          # expose for debugging; remove in prod
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - rag_net
    restart: unless-stopped

  # ── Redis semantic cache ─────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: senior_rag_redis
    ports:
      - "6379:6379"          # expose for debugging; remove in prod
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - rag_net
    restart: unless-stopped

volumes:
  chroma_data:
  redis_data:
  hf_cache:

networks:
  rag_net:
    driver: bridge
