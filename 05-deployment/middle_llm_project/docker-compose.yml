version: "3.9"

services:
  api:
    build:
      context: .
      target: runtime
    container_name: middle_llm_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Explicit overrides win over .env; keep as reference only
      - MODEL_NAME=${MODEL_NAME:-gpt-4o-mini}
      - TEMPERATURE=${TEMPERATURE:-0.7}
      - TIMEOUT=${TIMEOUT:-30.0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
