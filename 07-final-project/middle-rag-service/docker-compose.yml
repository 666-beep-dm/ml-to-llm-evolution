version: "3.9"

services:
  rag-api:
    build: .
    container_name: mini_rag_service
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./vector_db:/app/vector_db     # persist embeddings
      - ./logs:/app/logs               # persist logs
      - ./data:/app/data:ro            # read-only sample data
    restart: unless-stopped
    # ── GPU support (NVIDIA) — uncomment if GPU is available ──────────────────
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import httpx; httpx.get('http://localhost:8000/').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
