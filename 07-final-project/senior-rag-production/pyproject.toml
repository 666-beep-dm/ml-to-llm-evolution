[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "senior-rag-production"
version = "3.0.0"
description = "Production-Ready RAG Service with Clean Architecture"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "sentence-transformers==2.7.0",
    "qdrant-client==1.9.1",
    "redis[hiredis]==5.0.4",
    "langchain-text-splitters==0.2.0",
    "httpx==0.27.0",
    "pdfplumber==0.11.0",
    "python-multipart==0.0.9",
    "python-dotenv==1.0.1",
    "orjson==3.10.3",
    "structlog==24.2.0",
    "prometheus-client==0.20.0",
    "tenacity==8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
